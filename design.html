<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web page</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            height: 100px;
            column-gap: 5px;
        }
        .flex-container{
            display: flex;
            flex-direction: row;
            height: 100px;
            justify-content: space-around;
        }
        @media(max-width:500px){
            .flex-container{
            display: flex;
            flex-direction: column;
            height: 100px;
            column-gap: 10px;
        }
    }
    </style>
</head>
<body>

    <div class="flex-container">
        <div style=" flex:1;background-color: red;">div1</div>
        <div style=" flex:2;background-color: blue;">div2</div>
        <div style=" flex:3;background-color: yellow;">div3</div>
        <div style=" flex:4;background-color: brown;">div4</div>
    </div>
</body>
</html>
